<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Ordem de Serviço</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-visualizar {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-visualizar:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Ordem de Serviço #2026</h2>
        <p>Clique abaixo para abrir a OS em uma nova aba para visualização sem baixar automaticamente.</p>
        
        <!-- Botão que aciona a função JavaScript para abrir o arquivo sem forçar o download -->
        <button class="btn-visualizar" onclick="abrirOrdemDeServico()">Visualizar OS</button>
    </div>

    <script>
        async function abrirOrdemDeServico() {
            try {
                // Substitua '/sua-api/obter-os/123' pela URL real da sua API ou rota que retorna o arquivo PDF
                const resposta = await fetch('/sua-api/obter-os/123');
                
                if (!resposta.ok) {
                    throw new Error('Não foi possível carregar o arquivo da OS.');
                }

                // Converte a resposta do servidor em um Blob (binário do PDF)
                const blob = await resposta.blob();
                
                // Cria uma URL temporária apontando para este Blob na memória do navegador
                const urlBlob = URL.createObjectURL(blob);

                // Abre a URL temporária em uma nova aba. 
                // Como o tipo é PDF e a URL é tratada pelo navegador, ele abrirá o visualizador nativo.
                const novaAba = window.open(urlBlob, '_blank');

                if (!novaAba) {
                    alert('O navegador bloqueou a abertura da nova aba. Por favor, permita os pop-ups.');
                }
            } catch (erro) {
                console.error('Erro ao abrir a OS:', erro);
                alert('Erro ao tentar visualizar a Ordem de Serviço.');
            }
        }
    </script>

</body>
</html>
