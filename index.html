<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Máquinas</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --border-color: #e2e8f0;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --info-color: #6366f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: var(--text-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger-color);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 5px solid var(--primary-color);
            position: relative;
        }

        .card.aguardando { border-left-color: var(--warning-color); }
        .card.processo { border-left-color: var(--primary-color); }
        .card.atrasada { border-left-color: var(--danger-color); }
        .card.entregue { border-left-color: var(--success-color); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .machine-name {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }

        .badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
        }

        .badge.aguardando { background-color: var(--warning-color); }
        .badge.processo { background-color: var(--primary-color); }
        .badge.atrasada { background-color: var(--danger-color); }
        .badge.entregue { background-color: var(--success-color); }

        .card-body {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .card-body p {
            margin: 6px 0;
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel de Máquinas</h1>
            <button class="btn" onclick="openModal()">+ Nova Máquina</button>
        </header>

        <div class="filters">
            <button class="filter-btn active" onclick="filterMachines('all', this)">Todas</button>
            <button class="filter-btn" onclick="filterMachines('aguardando', this)">Aguardando</button>
            <button class="filter-btn" onclick="filterMachines('processo', this)">Em Processo</button>
            <button class="filter-btn" onclick="filterMachines('atrasada', this)">Atrasadas</button>
            <button class="filter-btn" onclick="filterMachines('entregue', this)">Entregues</button>
        </div>

        <div class="grid" id="machineGrid">
            <!-- Os cards serão injetados via JavaScript -->
        </div>
    </div>

    <!-- Modal Adicionar/Editar -->
    <div class="modal" id="machineModal">
        <div class="modal-content">
            <h2 id="modalTitle">Adicionar Nova Máquina</h2>
            <form id="machineForm" onsubmit="saveMachine(event)">
                <input type="hidden" id="machineId">
                <div class="form-group">
                    <label for="machineName">Nome da Máquina</label>
                    <input type="text" id="machineName" required placeholder="Ex: Torno CNC 01">
                </div>
                <div class="form-group">
                    <label for="machineClient">Cliente / Setor</label>
                    <input type="text" id="machineClient" required placeholder="Ex: Manutenção Mecânica">
                </div>
                <div class="form-group">
                    <label for="startDate">Data de Início</label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-group">
                    <label for="dueDate">Data de Previsão</label>
                    <input type="date" id="dueDate" required>
                </div>
                <div class="form-group">
                    <label for="endDate">Data de Finalização (Entrega)</label>
                    <input type="date" id="endDate">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let machines = JSON.parse(localStorage.getItem('machines')) || [
            { id: 1, name: 'Torno CNC 01', client: 'Oficina A', startDate: '', dueDate: '2026-10-01', endDate: '' },
            { id: 2, name: 'Fresadora 02', client: 'Setor B', startDate: '2026-09-01', dueDate: '2026-09-20', endDate: '' },
            { id: 3, name: 'Prensa Hidráulica', client: 'Manutenção', startDate: '2026-08-10', dueDate: '2026-09-01', endDate: '' },
            { id: 4, name: 'Solda MIG 04', client: 'Estruturas', startDate: '2026-09-05', dueDate: '2026-09-25', endDate: '2026-09-21' }
        ];

        let currentFilter = 'all';

        function calculateStatus(machine) {
            // Se tiver data de finalização, o status é entregue
            if (machine.endDate) return 'entregue';
            
            // Se não tiver data de início, o status é aguardando
            if (!machine.startDate) return 'aguardando';

            // Verifica se está atrasada (data de hoje maior que a previsão)
            const today = new Date().toISOString().split('T')[0];
            if (machine.dueDate && today > machine.dueDate) {
                return 'atrasada';
            }

            // Caso contrário, está em processo
            return 'processo';
        }

        function getStatusLabel(status) {
            const labels = {
                aguardando: 'Aguardando',
                processo: 'Em Processo',
                atrasada: 'Atrasada',
                entregue: 'Entregue'
            };
            return labels[status] || status;
        }

        function renderMachines() {
            const grid = document.getElementById('machineGrid');
            grid.innerHTML = '';

            const filtered = machines.filter(m => {
                const status = calculateStatus(m);
                if (currentFilter === 'all') return true;
                return status === currentFilter;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary);">Nenhuma máquina encontrada.</p>';
                return;
            }

            filtered.forEach(machine => {
                const status = calculateStatus(machine);
                const card = document.createElement('div');
                card.className = `card ${status}`;
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <h3 class="machine-name">${machine.name}</h3>
                            <span class="badge ${status}">${getStatusLabel(status)}</span>
                        </div>
                        <div class="card-body">
                            <p><strong>Cliente/Setor:</strong> ${machine.client}</p>
                            <p><strong>Início:</strong> ${machine.startDate ? formatDate(machine.startDate) : 'Não iniciado'}</p>
                            <p><strong>Previsão:</strong> ${machine.dueDate ? formatDate(machine.dueDate) : '-'}</p>
                            <p><strong>Finalização:</strong> ${machine.endDate ? formatDate(machine.endDate) : '-'}</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn" style="padding: 6px 12px; font-size: 12px;" onclick="editMachine(${machine.id})">Editar</button>
                        <button class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteMachine(${machine.id})">Excluir</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        }

        function openModal(id = null) {
            document.getElementById('machineModal').classList.add('active');
            if (id) {
                document.getElementById('modalTitle').innerText = 'Editar Máquina';
                const machine = machines.find(m => m.id === id);
                document.getElementById('machineId').value = machine.id;
                document.getElementById('machineName').value = machine.name;
                document.getElementById('machineClient').value = machine.client;
                document.getElementById('startDate').value = machine.startDate;
                document.getElementById('dueDate').value = machine.dueDate;
                document.getElementById('endDate').value = machine.endDate;
            } else {
                document.getElementById('modalTitle').innerText = 'Adicionar Nova Máquina';
                document.getElementById('machineForm').reset();
                document.getElementById('machineId').value = '';
            }
        }

        function closeModal() {
            document.getElementById('machineModal').classList.remove('active');
        }

        function saveMachine(event) {
            event.preventDefault();
            const id = document.getElementById('machineId').value;
            const name = document.getElementById('machineName').value;
            const client = document.getElementById('machineClient').value;
            const startDate = document.getElementById('startDate').value;
            const dueDate = document.getElementById('dueDate').value;
            const endDate = document.getElementById('endDate').value;

            if (id) {
                const machine = machines.find(m => m.id == id);
                machine.name = name;
                machine.client = client;
                machine.startDate = startDate;
                machine.dueDate = dueDate;
                machine.endDate = endDate;
            } else {
                const newMachine = {
                    id: Date.now(),
                    name,
                    client,
                    startDate,
                    dueDate,
                    endDate
                };
                machines.push(newMachine);
            }

            localStorage.setItem('machines', JSON.stringify(machines));
            closeModal();
            renderMachines();
        }

        function editMachine(id) {
            openModal(id);
        }

        function deleteMachine(id) {
            if (confirm('Tem certeza que deseja excluir esta máquina?')) {
                machines = machines.filter(m => m.id !== id);
                localStorage.setItem('machines', JSON.stringify(machines));
                renderMachines();
            }
        }

        function filterMachines(status, btn) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMachines();
        }

        // Inicializar aplicação
        renderMachines();
    </script>
</body>
</html>
