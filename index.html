<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP - DELTA — Controle de Produção</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --accent: #6366f1;
      --accent-contrast: #ffffff;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --bg-darker: #070d1e;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --card-hover: #172554;
    }
    body {
      background-color: var(--bg-darker);
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column;
    }
    .delta-header {
      background: linear-gradient(180deg, #0f172a 0%, #0b1329 100%);
      border-bottom: 1px solid #1e293b; padding: 0.85rem 1.5rem; position: sticky; top: 0; z-index: 40;
    }
    .header-content { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand-group { display: flex; align-items: center; gap: 0.85rem; }
    .brand-badge { background: linear-gradient(135deg, #6366f1, #3b82f6); color: #fff; font-weight: 800; padding: 0.35rem 0.65rem; border-radius: 8px; font-size: 1rem; }
    .brand-titles h1 { font-size: 1.1rem; font-weight: 700; margin: 0; color: #f8fafc; }
    .brand-titles p { font-size: 0.78rem; margin: 0; color: #94a3b8; }
    .header-meta { display: flex; align-items: center; gap: 0.85rem; flex-wrap: wrap; }
    .meta-tag { background: #1e293b; border: 1px solid #334155; padding: 0.25rem 0.65rem; border-radius: 6px; font-size: 0.78rem; color: #cbd5e1; display: inline-flex; align-items: center; gap: 0.4rem; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-emerald); box-shadow: 0 0 8px var(--accent-emerald); }
    .tabs-nav-container { background: #0b1329; border-bottom: 1px solid #1e293b; padding: 0 1.5rem; }
    .tabs-nav { max-width: 1400px; margin: 0 auto; display: flex; gap: 0.5rem; overflow-x: auto; }
    .tab-button { background: transparent; border: none; border-bottom: 2px solid transparent; color: #94a3b8; font-size: 0.88rem; font-weight: 600; padding: 0.85rem 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.15s ease; }
    .tab-button:hover { color: #f1f5f9; }
    .tab-button.active { color: #818cf8; border-bottom-color: #6366f1; }
    .delta-main { max-width: 1400px; margin: 0 auto; padding: 1.5rem; flex: 1; width: 100%; box-sizing: border-box; }
    .action-bar { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .action-group { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
    .btn-delta { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.5rem 0.95rem; font-size: 0.84rem; font-weight: 600; border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: all 0.15s ease; text-decoration: none; }
    .btn-indigo { background: #4f46e5; color: #fff; border-color: #6366f1; }
    .btn-indigo:hover { background: #4338ca; }
    .btn-emerald { background: #059669; color: #fff; border-color: #10b981; }
    .btn-emerald:hover { background: #047857; }
    .btn-slate { background: #1e293b; color: #e2e8f0; border-color: #334155; }
    .btn-slate:hover { background: #334155; }
    .btn-danger { background: #991b1b; color: #fee2e2; border-color: #ef4444; }
    .btn-danger:hover { background: #7f1d1d; }
    .btn-sm { padding: 0.35rem 0.6rem; font-size: 0.78rem; }
    .filters-box { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 1rem; margin-bottom: 1.25rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group label { font-size: 0.75rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
    .input-delta, select.input-delta { background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 0.45rem 0.65rem; border-radius: 6px; font-size: 0.84rem; outline: none; width: 100%; box-sizing: border-box; }
    .input-delta:focus { border-color: #6366f1; }
    .table-info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.65rem; font-size: 0.82rem; color: #94a3b8; }
    .table-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .table-scroll { overflow-x: auto; max-width: 100%; }
    .delta-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: left; }
    .delta-table th { background: #162036; color: #94a3b8; font-weight: 600; padding: 0.75rem 0.85rem; border-bottom: 1px solid #283548; text-transform: uppercase; font-size: 0.72rem; }
    .delta-table td { padding: 0.65rem 0.85rem; border-bottom: 1px solid #1e293b; color: #cbd5e1; vertical-align: middle; }
    .delta-table tbody tr:hover { background-color: #172554; }
    .badge-status { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.55rem; border-radius: 9999px; font-size: 0.72rem; font-weight: 600; }
    .status-entregue { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .status-andamento { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .status-aguardando { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .pill-linha { display: inline-block; padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .pill-linha.pesada { border-color: #818cf8; color: #c7d2fe; background: #1e1e38; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal-dialog { background: #0f172a; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
    .modal-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
    .modal-header h3 { margin: 0; font-size: 1.1rem; color: #f8fafc; }
    .modal-close { background: transparent; border: none; color: #94a3b8; font-size: 1.3rem; cursor: pointer; }
    .modal-body { padding: 1.5rem; }
    .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid #1e293b; display: flex; justify-content: flex-end; gap: 0.75rem; background: #090e1a; border-radius: 0 0 16px 16px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="delta-header">
    <div class="header-content">
      <div class="brand-group">
        <div class="brand-badge">DELTA</div>
        <div class="brand-titles">
          <h1>CP - DELTA — Controle de Produção</h1>
          <p>Gestão de fabrico e expedição de máquinas CNC</p>
        </div>
      </div>
      <div class="header-meta">
        <div class="meta-tag">📅 <strong id="lblRefMonth">Setembro/2026</strong></div>
        <div class="meta-tag"><span class="status-dot"></span><span>Online</span></div>
        <div class="meta-tag" id="clockEl">⏱️ 00:00:00</div>
        <div class="meta-tag">👤 <span id="currentUserLabel" style="font-weight:600;">Administrador</span></div>
        <button id="authBtn" class="btn-delta btn-slate btn-sm" onclick="toggleAuthModal()">Entrar</button>
      </div>
    </div>
  </header>

  <nav class="tabs-nav-container">
    <div class="tabs-nav">
      <button class="tab-button active" onclick="switchTab('acompanhamento')">📋 Acompanhamento</button>
      <button class="tab-button" onclick="switchTab('dashboard')">📊 Dashboard</button>
    </div>
  </nav>

  <main class="delta-main">
    <section id="tab-acompanhamento">
      <div class="filters-box">
        <div class="form-group">
          <label>Pesquisar Máquina / Cliente / OS</label>
          <input type="text" id="filterSearch" class="input-delta" placeholder="Ex.: Fiber, DM01..." oninput="renderTable()">
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="filterStatus" class="input-delta" onchange="renderTable()">
            <option value="todos">Todos os Estados</option>
            <option value="Aguardando produção">Aguardando produção</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Entregue">Entregue</option>
          </select>
        </div>
      </div>

      <div class="action-bar">
        <div class="action-group">
          <button class="btn-delta btn-indigo" onclick="openMachineModal()">➕ Registar Máquina</button>
          <button class="btn-delta btn-danger" onclick="deleteSelectedMachines()">🗑️ Excluir Selecionados</button>
        </div>
      </div>

      <div class="table-info-bar">
        <div><span class="meta-tag" id="countShowing">Mostrando 0 de 0 máquinas</span></div>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="delta-table" id="machinesTable">
            <thead>
              <tr>
                <th style="width: 35px; text-align:center;"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)"></th>
                <th>Equipa</th>
                <th>Cliente</th>
                <th>Máquina CNC</th>
                <th>Linha</th>
                <th>Início</th>
                <th>Previsão Entrega</th>
                <th>Entrega Real</th>
                <th>Estado</th>
                <th>Observações</th>
                <th style="text-align:center;">OS</th>
                <th style="text-align:right;">Ações</th>
              </tr>
            </thead>
            <tbody id="machinesTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL MÁQUINA -->
  <div id="machineModal" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="machineModalTitle">Registar Máquina CNC</h3>
        <button class="modal-close" onclick="closeMachineModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="machineForm" onsubmit="saveMachine(event)">
          <input type="hidden" id="machId">
          <div class="grid-2" style="margin-bottom:1rem;">
            <div class="form-group">
              <label>Nº da OS</label>
              <input type="text" id="machOs" class="input-delta" placeholder="Ex.: DM12" required>
            </div>
            <div class="form-group">
              <label>Equipa Responsável</label>
              <input type="text" id="machTeam" class="input-delta" placeholder="Ex.: Felipe e Arthur" required>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:1rem;">
            <label>Cliente</label>
            <input type="text" id="machClient" class="input-delta" placeholder="Razão social" required>
          </div>
          <div class="grid-2" style="margin-bottom:1rem;">
            <div class="form-group">
              <label>Modelo da Máquina</label>
              <input type="text" id="machModel" class="input-delta" placeholder="Ex.: Fiber Split 50W" required>
            </div>
            <div class="form-group">
              <label>Linha de Produção</label>
              <select id="machLinha" class="input-delta">
                <option value="Leve">Linha Leve</option>
                <option value="Intermediária">Linha Intermediária</option>
                <option value="Pesada">Linha Pesada</option>
              </select>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:1rem;">
            <label>Ficheiro PDF da Ordem de Serviço (Opcional)</label>
            <input type="file" id="machPdf" class="input-delta" accept="application/pdf">
          </div>
          <div class="modal-footer" style="padding:1rem 0 0; background:transparent;">
            <button type="button" class="btn-delta btn-slate" onclick="closeMachineModal()">Cancelar</button>
            <button type="submit" class="btn-delta btn-indigo">Guardar Máquina</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = { MACHINES: 'DELTA_MACHINES_DATA' };
    const IDB_NAME = 'delta-cnc-db';
    const IDB_STORE = 'pdfs';
    let appMachines = [];
    let selectedMachineIds = new Set();

    function idbAbrir() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, { keyPath: 'id' });
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function idbSalvarPdf(id, dataUrl) {
      if (!id || !dataUrl) return;
      const db = await idbAbrir();
      return new Promise((resolve, reject) => {
        const tx = db.transaction([IDB_STORE], 'readwrite');
        const req = tx.objectStore(IDB_STORE).put({ id: String(id), dataUrl });
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function idbBuscarPdf(id) {
      if (!id) return null;
      try {
        const db = await idbAbrir();
        return new Promise((resolve, reject) => {
          const tx = db.transaction([IDB_STORE], 'readonly');
          const req = tx.objectStore(IDB_STORE).get(String(id));
          req.onsuccess = () => resolve(req.result ? req.result.dataUrl : null);
          req.onerror = (e) => reject(e.target.error);
        });
      } catch (err) { return null; }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      renderTable();
    });

    function loadStorage() {
      try {
        const m = localStorage.getItem(STORAGE_KEYS.MACHINES);
        appMachines = m ? JSON.parse(m) : [];
      } catch (e) { appMachines = []; }
    }

    async function saveData() {
      try {
        localStorage.setItem(STORAGE_KEYS.MACHINES, JSON.stringify(appMachines));
      } catch (e) { alert('Erro ao salvar no armazenamento local.'); }
    }

    async function verPdfOs(id) {
      const item = appMachines.find(m => m.id === id);
      if (!item) { alert('Máquina não encontrada.'); return; }
      if (item.pdfData && item.pdfData.trim()) { openPdfFromBase64(item.pdfData); return; }
      if (item.hasPdf) {
        const storedPdf = await idbBuscarPdf(item.id);
        if (storedPdf && storedPdf.trim()) { openPdfFromBase64(storedPdf); return; }
      }
      alert('Documento PDF não encontrado para esta OS.');
    }
    window.verPdfOs = verPdfOs;

    function openPdfFromBase64(pdfDataUri) {
      try {
        const commaIdx = pdfDataUri.indexOf(',');
        const base64 = commaIdx >= 0 ? pdfDataUri.slice(commaIdx + 1) : pdfDataUri;
        const byteCharacters = atob(base64.trim());
        const byteNumbers = new Uint8Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
        const blob = new Blob([byteNumbers], { type: 'application/pdf' });
        const blobUrl = URL.createObjectURL(blob);
        window.open(blobUrl, '_blank');
        setTimeout(() => URL.revokeObjectURL(blobUrl), 120000);
      } catch (err) { window.open(pdfDataUri, '_blank'); }
    }

    function renderTable() {
      const tbody = document.getElementById('machinesTableBody');
      const search = document.getElementById('filterSearch').value.toLowerCase().trim();
      const statusFilter = document.getElementById('filterStatus').value;

      const filtered = appMachines.filter(item => {
        const status = item.entregaReal ? 'Entregue' : (item.inicio ? 'Em andamento' : 'Aguardando produção');
        if (search && !`${item.os} ${item.cliente} ${item.maquina}`.toLowerCase().includes(search)) return false;
        if (statusFilter !== 'todos' && status !== statusFilter) return false;
        return true;
      });

      document.getElementById('countShowing').textContent = `Mostrando ${filtered.length} de ${appMachines.length} máquinas`;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="12" style="text-align:center; padding:2rem; color:#64748b;">Nenhuma máquina registada.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const status = item.entregaReal ? 'Entregue' : (item.inicio ? 'Em andamento' : 'Aguardando produção');
        let osHtml = `<span style="color:#64748b;">—</span>`;
        if (item.pdfData || item.hasPdf) {
          osHtml = `<button type="button" class="btn-delta btn-indigo btn-sm" onclick="verPdfOs('${item.id}')">📄 Ver OS</button>`;
        }
        return `
          <tr>
            <td style="text-align:center;"><input type="checkbox" onchange="toggleSelectMachine('${item.id}', this)"></td>
            <td><strong>${item.equipe || '—'}</strong></td>
            <td>${item.cliente || '—'}</td>
            <td><b>${item.maquina || '—'}</b></td>
            <td><span class="pill-linha">${item.linha || 'Leve'}</span></td>
            <td>${item.inicio || '—'}</td>
            <td>${item.previsao || '—'}</td>
            <td><strong style="color:#10b981;">${item.entregaReal || '—'}</strong></td>
            <td><span class="badge-status status-andamento">${status}</span></td>
            <td>${item.obs || '—'}</td>
            <td style="text-align:center;">${osHtml}</td>
            <td style="text-align:right;"><button class="btn-delta btn-slate btn-sm" onclick="editMachine('${item.id}')">✏️</button></td>
          </tr>
        `;
      }).join('');
    }

    function openMachineModal() {
      document.getElementById('machineForm').reset();
      document.getElementById('machId').value = '';
      document.getElementById('machineModal').classList.add('open');
    }

    function closeMachineModal() { document.getElementById('machineModal').classList.remove('open'); }

    async function saveMachine(e) {
      e.preventDefault();
      const id = document.getElementById('machId').value || ('M_' + Date.now());
      const os = document.getElementById('machOs').value;
      const equipe = document.getElementById('machTeam').value;
      const cliente = document.getElementById('machClient').value;
      const maquina = document.getElementById('machModel').value;
      const linha = document.getElementById('machLinha').value;
      const pdfInput = document.getElementById('machPdf');

      let hasPdf = false;
      if (pdfInput.files && pdfInput.files[0]) {
        const reader = new FileReader();
        reader.onload = async function(event) {
          await idbSalvarPdf(id, event.target.result);
          appMachines.unshift({ id, os, equipe, cliente, maquina, linha, hasPdf: true, pdfData: '' });
          await saveData();
          renderTable();
          closeMachineModal();
        };
        reader.readAsDataURL(pdfInput.files[0]);
      } else {
        appMachines.unshift({ id, os, equipe, cliente, maquina, linha, hasPdf: false, pdfData: '' });
        await saveData();
        renderTable();
        closeMachineModal();
      }
    }

    function toggleSelectMachine(id, cb) {
      if (cb.checked) selectedMachineIds.add(id);
      else selectedMachineIds.delete(id);
    }

    function deleteSelectedMachines() {
      if (selectedMachineIds.size === 0) return alert('Selecione itens.');
      appMachines = appMachines.filter(m => !selectedMachineIds.has(m.id));
      selectedMachineIds.clear();
      saveData();
      renderTable();
    }
  </script>
</body>
</html>
