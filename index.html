<script>
/* =========================================================
   IMPORTAR VÁRIAS OS
   Seleciona vários PDFs de Ordem de Serviço, a IA (Gemini)
   lê cada um e preenche automaticamente a tabela de
   acompanhamento, com prévia para revisão antes de salvar.
   Colar no final do index_8_.html, antes de </body>.
   ========================================================= */
(function () {
  'use strict';

  /* ---------- 1. CONFIGURAÇÃO ---------- */
  var MODELO_GEMINI = 'gemini-1.5-flash';
  var CHAVES_PROVAVEIS = ['geminiApiKey', 'gemini_api_key', 'geminiKey', 'apiKey', 'api_key', 'GEMINI_API_KEY'];

  function obterChave() {
    try {
      for (var i = 0; i < CHAVES_PROVAVEIS.length; i++) {
        var v = localStorage.getItem(CHAVES_PROVAVEIS[i]);
        if (v && v.trim()) return v.trim();
      }
    } catch (e) {}
    return '';
  }

  /* ---------- 2. ESTILOS DO MODAL ---------- */
  var CSS =
    '#osModalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:inherit}' +
    '#osModal{background:#fff;border-radius:12px;width:min(1100px,94vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}' +
    '#osModal header{padding:16px 20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;background:#f8fafc}' +
    '#osModal header h2{margin:0;font-size:18px;color:#0f172a}' +
    '#osModal .osBody{padding:18px 20px;overflow-y:auto;flex:1}' +
    '#osModal .osRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}' +
    '#osModal label{font-size:13px;color:#475569;font-weight:600}' +
    '#osModal input[type=file]{flex:1;min-width:260px;padding:8px;border:1px dashed #94a3b8;border-radius:8px;background:#f8fafc}' +
    '#osModal input[type=text],#osModal input[type=password]{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;width:100%;box-sizing:border-box}' +
    '#osModal .osBtn{padding:9px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}' +
    '#osModal .osBtnPrimary{background:#2563eb;color:#fff}' +
    '#osModal .osBtnPrimary:hover{background:#1d4ed8}' +
    '#osModal .osBtnGreen{background:#059669;color:#fff}' +
    '#osModal .osBtnGreen:hover{background:#047857}' +
    '#osModal .osBtnGhost{background:#e2e8f0;color:#334155}' +
    '#osModal .osBtn:disabled{opacity:.5;cursor:not-allowed}' +
    '#osModal .osStatus{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}' +
    '#osModal .osStatus.ok{display:block;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}' +
    '#osModal .osStatus.err{display:block;background:#fef2f2;color:#991b1b;border:1px solid #fecaca}' +
    '#osModal .osStatus.info{display:block;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}' +
    '#osModal .osTabela{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}' +
    '#osModal .osTabela th{background:#f1f5f9;color:#334155;padding:8px 6px;border:1px solid #e2e8f0;text-align:left;position:sticky;top:0}' +
    '#osModal .osTabela td{padding:4px 6px;border:1px solid #e2e8f0;vertical-align:top}' +
    '#osModal .osTabela input[type=text]{padding:5px 6px;font-size:12px;border:1px solid #e2e8f0;border-radius:5px;width:100%;min-width:80px}' +
    '#osModal .osTabela input[type=checkbox]{transform:scale(1.15)}' +
    '#osModal footer{padding:14px 20px;border-top:1px solid #e5e7eb;display:flex;gap:10px;justify-content:flex-end;background:#f8fafc}' +
    '#osModal .osClose{background:none;border:none;font-size:22px;cursor:pointer;color:#64748b;line-height:1}';

  /* ---------- 3. CRIAR O BOTÃO NA BARRA DE AÇÕES ---------- */
  function criarBotao() {
    var alvo = null;
    var botoes = document.querySelectorAll('button');
    for (var i = 0; i < botoes.length; i++) {
      if (/adicionar\s*m[áa]quina/i.test(botoes[i].textContent || '')) {
        alvo = botoes[i];
        break;
      }
    }
    if (!alvo) {
      var barras = document.querySelectorAll('.toolbar, .actions, .btn-group, .acoes, .action-bar');
      for (var j = 0; j < barras.length; j++) {
        if (barras[j].querySelector('button')) { alvo = barras[j]; break; }
      }
    }
    if (!alvo) return false;

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'btnImportarOS';
    btn.textContent = '📥 Importar várias OS';
    btn.style.cssText = 'padding:9px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;background:#059669;color:#fff;margin:0 4px;display:inline-flex;align-items:center;gap:6px';
    btn.addEventListener('mouseenter', function () { btn.style.background = '#047857'; });
    btn.addEventListener('mouseleave', function () { btn.style.background = '#059669'; });
    btn.addEventListener('click', abrirModal);

    if (alvo.tagName === 'BUTTON') alvo.parentNode.insertBefore(btn, alvo);
    else alvo.appendChild(btn);
    return true;
  }

  /* ---------- 4. MODAL ---------- */
  var overlay, inputArquivos, listaArquivos, campoChave, statusBox, corpoTabela, btnLer, btnSalvar, registrosAtuais = [];

  function abrirModal() {
    if (document.getElementById('osModalOverlay')) return;
    var style = document.createElement('style');
    style.id = 'osModalStyle';
    style.textContent = CSS;
    document.head.appendChild(style);

    overlay = document.createElement('div');
    overlay.id = 'osModalOverlay';
    overlay.innerHTML =
      '<div id="osModal">' +
        '<header><h2>📥 Importar várias OS</h2><button class="osClose" title="Fechar">&times;</button></header>' +
        '<div class="osBody">' +
          '<div class="osRow">' +
            '<label>Selecionar PDFs de OS (pode escolher vários):</label>' +
            '<input type="file" accept="application/pdf,.pdf" multiple>' +
          '</div>' +
          '<div class="osRow">' +
            '<label style="min-width:200px">Chave da API Gemini:</label>' +
            '<input type="password" placeholder="Cole a chave aqui se não estiver configurada" style="flex:1">' +
          '</div>' +
          '<div class="osStatus"></div>' +
          '<button class="osBtn osBtnPrimary" style="margin-bottom:14px">🤖 Ler PDFs com IA</button>' +
          '<div style="overflow:auto;max-height:46vh">' +
            '<table class="osTabela"><thead><tr>' +
              '<th><input type="checkbox" id="osSelTodos" checked></th>' +
              '<th>OS</th><th>Equipe</th><th>Cliente</th><th>Máquina</th><th>Linha</th>' +
              '<th>Início</th><th>Previsão</th><th>Entrega Real</th><th>Status</th><th>Observações</th>' +
            '</tr></thead><tbody></tbody></table>' +
          '</div>' +
        '</div>' +
        '<footer>' +
          '<button class="osBtn osBtnGhost" id="osFechar">Fechar</button>' +
          '<button class="osBtn osBtnGreen" id="osSalvar">💾 Salvar selecionados</button>' +
        '</footer>' +
      '</div>';

    document.body.appendChild(overlay);

    inputArquivos = overlay.querySelector('input[type=file]');
    campoChave = overlay.querySelector('input[type=password]');
    statusBox = overlay.querySelector('.osStatus');
    corpoTabela = overlay.querySelector('tbody');
    btnLer = overlay.querySelector('.osBtnPrimary');
    btnSalvar = overlay.querySelector('#osSalvar');
    btnSalvar.disabled = true;

    var chave = obterChave();
    if (chave) campoChave.value = chave;

    overlay.querySelector('.osClose').addEventListener('click', fecharModal);
    overlay.querySelector('#osFechar').addEventListener('click', fecharModal);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) fecharModal(); });
    btnLer.addEventListener('click', lerTodosOsPdfs);
    btnSalvar.addEventListener('click', salvarSelecionados);
    overlay.querySelector('#osSelTodos').addEventListener('change', function (e) {
      var cbs = corpoTabela.querySelectorAll('input[type=checkbox]');
      for (var i = 0; i < cbs.length; i++) cbs[i].checked = e.target.checked;
    });
  }

  function fecharModal() {
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    overlay = null;
  }

  function mostrarStatus(tipo, msg) {
    statusBox.className = 'osStatus ' + tipo;
    statusBox.textContent = msg;
  }

  /* ---------- 5. LEITURA DOS PDFs PELA IA ---------- */
  function lerTodosOsPdfs() {
    var chave = (campoChave.value || '').trim();
    if (!chave) {
      mostrarStatus('err', '⚠️ Configure a chave da API Gemini (campo acima ou nas Definições do app).');
      return;
    }
    var arquivos = Array.prototype.slice.call(inputArquivos.files || []).filter(function (f) {
      return /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
    });
    if (!arquivos.length) {
      mostrarStatus('err', '⚠️ Selecione pelo menos um PDF de OS.');
      return;
    }

    btnLer.disabled = true;
    btnSalvar.disabled = true;
    registrosAtuais = [];
    corpoTabela.innerHTML = '';
    mostrarStatus('info', 'Lendo ' + arquivos.length + ' PDF(s) com a IA... aguarde.');

    var pendentes = arquivos.length;
    arquivos.forEach(function (arquivo) {
      lerPdfComIA(arquivo, chave).then(function (registro) {
        registrosAtuais.push(registro);
        adicionarLinhaPrevia(registro);
      }).catch(function (erro) {
        registrosAtuais.push({
          os: arquivo.name.replace(/\.pdf$/i, ''),
          equipe: '', cliente: '', maquina: '', linha: '',
          inicio: '', previsao: '', entregaReal: '', status: 'Erro na leitura',
          observacoes: '⚠️ ' + (erro && erro.message ? erro.message : erro)
        });
        adicionarLinhaPrevia(registrosAtuais[registrosAtuais.length - 1]);
      }).then(function () {
        pendentes--;
        if (pendentes === 0) {
          btnLer.disabled = false;
          btnSalvar.disabled = false;
          mostrarStatus('ok', '✅ Leitura concluída: ' + registrosAtuais.length + ' OS lida(s). Revise os campos e clique em "Salvar selecionados".');
        }
      });
    });
  }

  function lerPdfComIA(arquivo, chave) {
    return new Promise(function (resolve, reject) {
      var leitor = new FileReader();
      leitor.onerror = function () { reject(new Error('Não foi possível ler o arquivo ' + arquivo.name)); };
      leitor.onload = function () {
        var base64 = String(leitor.result).split(',')[1];
        var prompt =
          'Você extrai dados de Ordens de Serviço (OS) de fabricação de máquinas CNC da empresa DELTA. ' +
          'Analise o PDF anexo e responda APENAS com um JSON válido, sem texto extra, sem markdown, com esta estrutura exata:\n' +
          '{\n' +
          '  "equipe": "nome do vendedor(a) se presente no PDF, senão vazio",\n' +
          '  "cliente": "nome completo do cliente",\n' +
          '  "maquina": "modelo completo da máquina",\n' +
          '  "linha": "tipo da máquina (ex.: Centro, Router, Centro Nesting)",\n' +
          '  "inicio": "data de venda no formato DD/MM/AAAA",\n' +
          '  "previsao": "data de entrega estimada no formato DD/MM/AAAA",\n' +
          '  "entregaReal": "",\n' +
          '  "status": "Em andamento",\n' +
          '  "os": "número da OS (ex.: DM97)",\n' +
          '  "observacoes": "CNPJ, TAG, contato e especificações técnicas, separados por |"\n' +
          '}\n' +
          'Regras: datas sempre em DD/MM/AAAA. Se um campo não existir no PDF, use string vazia. Não invente informações.';

        var corpo = {
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: 'application/pdf', data: base64 } }
            ]
          }]
        };

        fetch('https://generativelanguage.googleapis.com/v1beta/models/' + MODELO_GEMINI + ':generateContent?key=' + encodeURIComponent(chave), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(corpo)
        }).then(function (resp) {
          if (!resp.ok) {
            return resp.json().then(function (j) {
              var msg = (j && j.error && j.error.message) ? j.error.message : 'Erro HTTP ' + resp.status;
              throw new Error(msg);
            });
          }
          return resp.json();
        }).then(function (dados) {
          var texto = dados && dados.candidates && dados.candidates[0] &&
            dados.candidates[0].content && dados.candidates[0].content.parts &&
            dados.candidates[0].content.parts[0].text;
          if (!texto) throw new Error('A IA não retornou dados para ' + arquivo.name);
          texto = texto.replace(/```json/gi, '').replace(/```/g, '').trim();
          var inicioJson = texto.indexOf('{');
          var fimJson = texto.lastIndexOf('}');
          if (inicioJson === -1 || fimJson === -1) throw new Error('Resposta inválida da IA para ' + arquivo.name);
          var reg = JSON.parse(texto.substring(inicioJson, fimJson + 1));
          reg.os = reg.os || arquivo.name.replace(/\.pdf$/i, '');
          reg.status = reg.status || 'Em andamento';
          resolve(reg);
        }).catch(reject);
      };
      leitor.readAsDataURL(arquivo);
    });
  }

  function adicionarLinhaPrevia(reg) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><input type="checkbox" class="osLinhaSel" checked></td>' +
      '<td><input type="text" value="' + esc(reg.os) + '"></td>' +
      '<td><input type="text" value="' + esc(reg.equipe) + '"></td>' +
      '<td><input type="text" value="' + esc(reg.cliente) + '"></td>' +
      '<td><input type="text" value="' + esc(reg.maquina) + '"></td>' +
      '<td><input type="text" value="' + esc(reg.linha) + '"></td>' +
      '<td><input type="text" value="' + esc(reg.inicio) + '"></td>' +
      '<td><input type="text" value="' + esc(reg.previsao) + '"></td>' +
      '<td><input type="text" value="' + esc(reg.entregaReal) + '"></td>' +
      '<td><input type="text" value="' + esc(reg.status) + '"></td>' +
      '<td><input type="text" value="' + esc(reg.observacoes) + '"></td>';
    corpoTabela.appendChild(tr);
  }

  function esc(txt) {
    return String(txt == null ? '' : txt)
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
      .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---------- 6. SALVAR NA TABELA DO APP ---------- */
  function salvarSelecionados() {
    var linhas = corpoTabela.querySelectorAll('tr');
    var selecionados = [];
    for (var i = 0; i < linhas.length; i++) {
      var cb = linhas[i].querySelector('.osLinhaSel');
      if (cb && cb.checked) {
        var cels = linhas[i].querySelectorAll('input[type=text]');
        selecionados.push({
          os: cels[0].value, equipe: cels[1].value, cliente: cels[2].value,
          maquina: cels[3].value, linha: cels[4].value, inicio: cels[5].value,
          previsao: cels[6].value, entregaReal: cels[7].value,
          status: cels[8].value, observacoes: cels[9].value
        });
      }
    }
    if (!selecionados.length) {
      mostrarStatus('err', '⚠️ Marque pelo menos uma OS para salvar.');
      return;
    }

    var salvos = 0;
    selecionados.forEach(function (reg) {
      if (salvarNoApp(reg)) salvos++;
    });

    if (salvos > 0) {
      mostrarStatus('ok', '✅ ' + salvos + ' OS importada(s) e salva(s) na tabela!');
      btnSalvar.disabled = true;
      btnLer.disabled = true;
      setTimeout(function () {
        fecharModal();
        recarregarTabela();
      }, 1200);
    } else {
      /* Fallback: não encontrou a estrutura do app — entrega o JSON */
      var json = JSON.stringify(selecionados, null, 2);
      var ta = document.createElement('textarea');
      ta.value = json;
      ta.style.cssText = 'width:100%;height:200px;font-family:monospace;font-size:11px;margin-top:10px';
      statusBox.className = 'osStatus err';
      statusBox.innerHTML = '⚠️ Não consegui localizar automaticamente onde o app guarda os dados. Copie o JSON abaixo e cole no backup (ou me envie o código do <script> do arquivo para eu ligar o salvamento automático).';
      statusBox.appendChild(ta);
    }
  }

  function salvarNoApp(reg) {
    /* 1) Tenta funções globais do app */
    var funcoes = ['adicionarMaquina', 'addMachine', 'cadastrarMaquina', 'salvarMaquina', 'addMaquina', 'novaMaquina'];
    for (var i = 0; i < funcoes.length; i++) {
      if (typeof window[funcoes[i]] === 'function') {
        try { window[funcoes[i]](reg); return true; } catch (e) {}
      }
    }
    /* 2) Tenta localStorage (array de registros) */
    var chaves = ['maquinas', 'machines', 'producoes', 'registros', 'os', 'dados', 'delta', 'deltaData', 'appData', 'acompanhamento', 'production'];
    for (var j = 0; j < chaves.length; j++) {
      try {
        var bruto = localStorage.getItem(chaves[j]);
        if (!bruto) continue;
        var arr = JSON.parse(bruto);
        if (Array.isArray(arr)) {
          arr.push(reg);
          localStorage.setItem(chaves[j], JSON.stringify(arr));
          return true;
        }
      } catch (e) {}
    }
    return false;
  }

  function recarregarTabela() {
    var funcoes = ['renderTabela', 'renderTable', 'atualizarTabela', 'carregarDados', 'loadData', 'render', 'renderAcompanhamento'];
    for (var i = 0; i < funcoes.length; i++) {
      if (typeof window[funcoes[i]] === 'function') {
        try { window[funcoes[i]](); return; } catch (e) {}
      }
    }
    location.reload();
  }

  /* ---------- 7. INICIALIZAR ---------- */
  function iniciar() {
    if (!criarBotao()) {
      document.addEventListener('DOMContentLoaded', function () { criarBotao(); });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
</script>
